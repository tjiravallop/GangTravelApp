<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - เข้าสู่ระบบ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> .pixel-board { image-rendering: pixelated; image-rendering: crisp-edges; } </style>
</head>
<body class="min-h-screen bg-slate-900 font-sans m-0 text-slate-100 flex items-center justify-center bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]">

  <div class="w-full max-w-sm px-4">
    <div class="bg-slate-950/80 backdrop-blur-md p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-600/20 rounded-full blur-2xl pointer-events-none"></div>
      
      <div class="text-center mb-8 relative z-10">
        <div class="text-4xl mb-3 inline-block drop-shadow-md">✈️</div>
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 tracking-wider drop-shadow-sm uppercase">GangTrip</h1>
        <p class="text-xs text-slate-400 mt-2 font-medium tracking-widest uppercase">Travel & Share Board</p>
      </div>

      <form id="loginForm" class="space-y-5 relative z-10">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">🔑 ID Login (ไอดีเข้าใช้งาน)</label>
          <input type="text" id="loginId" required placeholder="เช่น Kookai11, Moo123" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner lowercase">
        </div>
        
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">🔒 พาสเวิร์ด 4 หลัก (PS)</label>
          <input type="password" id="loginPass" required maxlength="4" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-white font-mono font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner tracking-[0.5em]">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold py-3.5 rounded-xl text-sm tracking-wider shadow-lg transition-transform active:scale-95 cursor-pointer flex justify-center items-center gap-2 mt-4 border border-blue-500/50">
          🚀 เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    if (localStorage.getItem('gang_current_session')) { window.location.href = "dashboard.html"; }

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputId = document.getElementById('loginId').value.trim();
      const inputPass = document.getElementById('loginPass').value.trim();

      submitBtn.innerHTML = `⏳ กำลังตรวจสอบ...`; submitBtn.disabled = true;

      try {
        const docRef = doc(db, "gang_system", "passcodes");
        const docSnap = await getDoc(docRef);
        let users = docSnap.exists() ? (docSnap.data().users || []) : [];

        let foundUser = users.find(u => u.loginId && u.loginId.toLowerCase() === inputId.toLowerCase());

        // 🚨 [Backdoor VIP ของคุณเดฟ] ถ้า DB ว่าง และใส่รหัสแอดมิน ให้เสกข้อมูลลง Firebase อัตโนมัติทันที!
        if (!foundUser && (inputId.toLowerCase() === 'admin' || inputId.toLowerCase() === 'dave') && inputPass === '2308') {
          foundUser = { loginId: inputId.toLowerCase(), displayName: 'เดฟ', passcode: '2308' };
          users.push(foundUser);
          await setDoc(docRef, { users: users });
        }

        if (!foundUser) {
          alert("❌ ไม่มีชื่อนี้โว้ยยย ไปขอ ID จากแอดมินมาก่อน!");
        } else if (foundUser.passcode !== inputPass) {
          alert("ใส่รหัสผิดนะจ๊ะ");
        } else {
          // กำหนดสิทธิ์และเข้าสู่ระบบ
          let role = 'user';
          if (foundUser.loginId.toLowerCase() === 'admin' || foundUser.loginId.toLowerCase() === 'dave') role = 'admin';
          
          localStorage.setItem('gang_current_session', JSON.stringify({ 
            loginId: foundUser.loginId, 
            name: foundUser.displayName, // เก็บชื่อเล่นไว้โชว์
            role: role 
          }));
          window.location.href = "dashboard.html";
        }
      } catch (error) {
        alert("🔌 เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
      }
      submitBtn.innerHTML = `🚀 เข้าสู่ระบบ`; submitBtn.disabled = false;
    });
  </script>
</body>
</html>
