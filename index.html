<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - เข้าสู่ระบบ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* สไตล์คุมลายเส้นพิกเซลอาร์ท */
    .pixel-board { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 font-sans m-0 text-slate-100 flex items-center justify-center bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]">

  <div class="w-full max-w-sm px-4">
    <div class="bg-slate-950/80 backdrop-blur-md p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-600/20 rounded-full blur-2xl pointer-events-none"></div>
      
      <div class="text-center mb-8 relative z-10">
        <div class="text-4xl mb-3 inline-block drop-shadow-md">✈️</div>
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 tracking-wider drop-shadow-sm uppercase">GangTrip</h1>
        <p class="text-xs text-slate-400 mt-2 font-medium tracking-widest uppercase">Travel & Share Board</p>
      </div>

      <form id="loginForm" class="space-y-5 relative z-10">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">👤 ชื่อผู้เล่น (Display Name)</label>
          <input type="text" id="loginName" required placeholder="เช่น Mook, เดฟ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner">
        </div>
        
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">🔑 รหัสผ่าน 4 หลัก (PS)</label>
          <input type="password" id="loginPass" required maxlength="4" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-white font-mono font-bold focus:outline-none focus:border-blue-500 transition-colors shadow-inner tracking-[0.5em]">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold py-3.5 rounded-xl text-sm tracking-wider shadow-lg transition-transform active:scale-95 cursor-pointer flex justify-center items-center gap-2 mt-4 border border-blue-500/50">
          🚀 เข้าสู่ระบบ
        </button>
      </form>
      
      <p class="text-center text-[10px] text-slate-500 mt-6 font-medium">
        ยังไม่มีรหัส? ให้แอดมินสร้างสิทธิ์ให้ก่อนนะจ๊ะ
      </p>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ถ้าเคยล็อกอินค้างไว้ ให้เด้งไปหน้า Dashboard เลย
    const existingSession = localStorage.getItem('gang_current_session');
    if (existingSession) { window.location.href = "dashboard.html"; }

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const inputName = document.getElementById('loginName').value.trim();
      const inputPass = document.getElementById('loginPass').value.trim();

      // เปลี่ยนปุ่มเป็นสถานะกำลังโหลด
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = `⏳ กำลังตรวจสอบ...`;
      submitBtn.disabled = true;

      try {
        // ดึงข้อมูลรายชื่อเพื่อนและพาสเวิร์ดจาก Firebase
        const docRef = doc(db, "gang_system", "passcodes");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const users = docSnap.data().users || [];
          
          // ค้นหาชื่อที่กรอกเข้ามา (แปลงเป็นตัวพิมพ์เล็กหมดเพื่อกันการพิมพ์เล็กใหญ่ผิด)
          const foundUser = users.find(u => u.name.toLowerCase() === inputName.toLowerCase());

          if (!foundUser) {
            // กรณีที่ 1: หาชื่อไม่เจอ
            alert("❌ ไม่พบชื่อนี้ในระบบ หรือยังไม่ได้รับสิทธิ์เข้าใช้งาน! ติดต่อแอดมินด่วน!");
          } else if (foundUser.passcode !== inputPass) {
            // 🚨 กรณีที่ 2: ใส่พาสเวิร์ดผิด (จุดที่คุณเดฟรีเควส)
            alert("ใส่รหัสผิดนะจ๊ะ");
          } else {
            // ✅ กรณีที่ 3: ผ่านฉลุย!
            
            // 👑 กำหนดสิทธิ์: ถ้าชื่อคือ 'เดฟ' หรือ 'admin' ให้ได้รับสิทธิ์แอดมินอัตโนมัติ
            let role = 'user';
            if (foundUser.name.toLowerCase() === 'เดฟ' || foundUser.name.toLowerCase() === 'admin') {
              role = 'admin';
            }

            // บันทึก Session ลงเครื่อง
            const sessionData = { 
              name: foundUser.name, // ใช้ชื่อตามที่บันทึกในระบบเป๊ะๆ (ตัวเล็ก-ใหญ่)
              role: role 
            };
            localStorage.setItem('gang_current_session', JSON.stringify(sessionData));
            
            // เด้งไปหน้าหลัก
            window.location.href = "dashboard.html";
          }
        } else {
          alert("⚠️ ไม่พบฐานข้อมูลระบบใน Firebase ครับ (Admin ต้องไปสร้าง Database ก่อน)");
        }
      } catch (error) {
        console.error("Login Error:", error);
        alert("🔌 เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่");
      }

      // คืนค่าปุ่มกลับมาเหมือนเดิม
      submitBtn.innerHTML = originalBtnText;
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
