<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - เข้าสู่ระบบ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans m-0 text-slate-800">

  <div class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-blue-50 via-white to-teal-50">
    <header class="p-6 flex justify-between items-center max-w-6xl w-full mx-auto">
      <div class="flex items-center gap-2">
        <span class="text-2xl">✈️</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-teal-600 bg-clip-text text-transparent">GangTrip</h1>
      </div>
      <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">v5.2 ประตูหน้า (Global Fix)</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 max-w-3xl mx-auto -mt-6">
      <div class="inline-block bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider mb-4">Cloud Authentication</div>
      <h2 class="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight mb-6">
        วางแผนเที่ยวกับแก๊งเพื่อน <br>
        <span class="bg-gradient-to-r from-blue-600 to-teal-500 bg-clip-text text-transparent">ระบบล็อกสิทธิ์ฐานข้อมูลคลาวด์</span>
      </h2>
      
      <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 max-w-sm w-full mx-auto">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">🔑 กรอกรหัสผ่านเข้าใช้งาน (ADMIN หรือ รหัสส่วนตัว)</label>
        <input type="password" id="gangPasscode" placeholder="••••" maxlength="8" class="w-full text-center tracking-widest border border-gray-200 bg-slate-50 rounded-xl px-3 py-3 text-2xl font-black mb-4 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-50/50">
        <button onclick="checkPasscode()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-blue-700 shadow-md transition-all active:scale-98 cursor-pointer">
          ยืนยันรหัสผ่านเข้าสู่แอป →
        </button>
        <p id="passcodeError" class="text-xs text-red-500 mt-3 font-semibold hidden">❌ ไม่พบรหัสผ่านนี้ในฐานข้อมูลคลาวด์!</p>
      </div>
    </main>
    <footer class="p-6 text-center text-xs text-gray-400 border-t border-gray-100 w-full">© 2026 GangTrip Cloud</footer>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ตรวจสอบเซสชันเก่า ถ้าเครื่องนี้เคยล็อกอินค้างไว้แล้ว ให้วาร์ปข้ามหน้าแรกไปหน้าแดชบอร์ดเลย
    const savedSession = localStorage.getItem('gang_current_session');
    if (savedSession) {
      window.location.href = "dashboard.html";
    }

    // 🔥 ส่งออกฟังก์ชันพาสเวิร์ดออกไปนอก Module เพื่อให้ปุ่ม HTML ด้านบนมองเห็นและกดเรียกใช้ได้จริง
    window.checkPasscode = async function() {
      const inputCode = document.getElementById('gangPasscode').value.trim();
      let sessionData = null;

      if (inputCode === '2308') {
        sessionData = { name: 'เดฟ (ADMIN)', role: 'admin' };
      } else {
        try {
          // ดึงรายชื่อพาสเวิร์ดเพื่อนๆ ล่าสุดจากคลาวด์มาสแกนดู
          const docSnap = await getDoc(doc(db, "gang_system", "passcodes"));
          if (docSnap.exists()) {
            const userRegistry = docSnap.data().users || [];
            const foundUser = userRegistry.find(u => u.passcode === inputCode);
            if (foundUser) {
              sessionData = { name: foundUser.name, role: 'user' };
            }
          }
        } catch (err) {
          console.error("Firebase Error:", err);
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อคลาวด์");
        }
      }

      if (sessionData) {
        // เซฟเซสชันสิทธิ์ลงคอมเครื่องนี้ และสั่งวาร์ปบราวเซอร์เปลี่ยนหน้าไฟล์ทันที!
        localStorage.setItem('gang_current_session', JSON.stringify(sessionData));
        window.location.href = "dashboard.html";
      } else {
        document.getElementById('passcodeError').classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
