<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - ทริปของฉัน</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> .pixel-board { image-rendering: pixelated; image-rendering: crisp-edges; } </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans m-0 text-slate-800">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
        <span class="text-2xl">✈️</span>
        <span class="text-xl font-black text-gray-900 tracking-tight">GangTrip</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSettingsModal()" class="flex items-center gap-2 bg-slate-50 hover:bg-slate-100 p-1.5 pr-3 rounded-full transition-all cursor-pointer shadow-sm border border-slate-200 group">
          <div class="w-8 h-8 rounded-full bg-slate-800 overflow-hidden relative flex-shrink-0 border border-slate-300 group-hover:scale-105 transition-transform">
            <div id="headerAvatarImg" class="absolute inset-0 w-full h-full pixel-board" style="background-image: url('assets/chars/1.png'); background-size: cover; background-position: left center;"></div>
          </div>
          <div class="text-left hidden sm:block">
            <p id="navUserDisplayName" class="text-xs font-bold text-slate-700 leading-tight">Loading...</p>
            <p id="navUserRoleBadge" class="text-[9px] font-bold text-blue-500 uppercase tracking-wider">User</p>
          </div>
        </button>
        <button onclick="logoutGang()" class="w-10 h-10 rounded-full bg-red-50 hover:bg-red-500 text-red-500 hover:text-white flex items-center justify-center font-bold transition-all cursor-pointer shadow-sm" title="ออกจากระบบ">🚪</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">ทริปบนระบบคลาวด์</h2>
        <p class="text-sm text-gray-500">ซิงค์ข้อมูลแผนเดินทางและแชร์บิลแบบเรียลไทม์ร่วมกับทุกคนในแก๊ง</p>
      </div>
      <button onclick="openModal('create')" class="bg-blue-600 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm hover:bg-blue-700 transition-all text-sm flex items-center gap-2 cursor-pointer">
        <span class="text-lg font-bold">+</span> สร้างทริปใหม่
      </button>
    </div>
    <div id="tripListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-900 text-white shrink-0">
        <h3 class="text-md font-bold">⚙️ การตั้งค่าบัญชี & ระบบ</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white font-bold text-2xl cursor-pointer">×</button>
      </div>
      <div class="p-5 overflow-y-auto space-y-5">
        
        <button onclick="window.location.href='avatar-builder.html'" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl shadow-md transition-transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
          🎨 เข้าห้องแต่งตัวอวตาร (Avatar Builder)
        </button>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <p class="text-xs font-bold text-slate-500 uppercase mb-3">👤 แก้ไขข้อมูลส่วนตัว</p>
          <form onsubmit="handleUpdateSelf(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">ชื่อที่แสดง</label>
                <input type="text" id="selfNameInput" required class="w-full border border-slate-300 rounded-lg p-2 text-xs font-semibold bg-white focus:border-blue-500 outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">เปลี่ยนรหัสผ่าน (PS)</label>
                <input type="text" id="selfPassInput" required maxlength="4" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-mono font-bold text-center bg-white focus:border-blue-500 outline-none">
              </div>
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg text-xs cursor-pointer transition-colors">💾 บันทึกข้อมูลส่วนตัว</button>
          </form>
        </div>

        <div id="adminSettingsSection" class="hidden border-t border-slate-200 pt-5">
          <p class="text-xs font-black text-amber-600 uppercase mb-3 flex items-center gap-1">👑 ห้องควบคุมเครือข่าย (Admin Panel)</p>
          <form onsubmit="handleAdminUpdateUser(event)" class="bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-3 mb-4">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-amber-800 mb-0.5">ชื่อเพื่อน</label>
                <input type="text" id="adminFriendName" required placeholder="เพิ่ม/แก้ไขชื่อ" class="w-full border border-amber-300 rounded-lg p-1.5 text-xs bg-white">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-amber-800 mb-0.5">พาสเวิร์ด (PS)</label>
                <input type="text" id="adminFriendPass" required maxlength="4" class="w-full border border-amber-300 rounded-lg p-1.5 text-xs bg-white text-center font-bold">
              </div>
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-xs cursor-pointer shadow-sm">⚡ เพิ่ม / อัปเดตสิทธิ์เพื่อน</button>
          </form>
          <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">📋 ข้อมูลบัญชีในเครือข่ายทั้งหมด</p>
            <div id="adminUserTableContainer" class="space-y-1.5 max-h-[140px] overflow-y-auto pr-1"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="tripModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-900">สร้างทริป</h3>
        <button onclick="closeModal()" class="text-gray-400 font-bold text-xl cursor-pointer">×</button>
      </div>
      <form onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="editTripId">
        <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">ชื่อทริปสุดเฟี้ยว</label><input type="text" id="tripName" required class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm"></div>
        <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">ไปที่ไหนกันดี</label><input type="text" id="tripDest" required class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">วันเริ่มเดินทาง</label><input type="date" id="startDate" required class="w-full border border-gray-300 rounded-xl px-2 py-1.5 text-sm"></div>
          <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">วันเดินทางกลับ</label><input type="date" id="endDate" required class="w-full border border-gray-300 rounded-xl px-2 py-1.5 text-sm"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-600 uppercase mb-1">🖼️ เลือกฉากหลังประจำทริป</label>
          <select id="tripBgSelect" class="w-full border border-blue-300 bg-blue-50/30 rounded-xl px-3 py-2 text-sm bg-white font-medium"></select>
        </div>
        <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">👥 รายชื่อเพื่อนร่วมทริป (คั่นด้วยเครื่องหมายจุลภาค ,)</label><input type="text" id="tripMembersInput" required placeholder="เดฟ, Mook, Pangpond, เอก" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm"></div>
        <div class="flex gap-3 pt-4 border-t border-gray-100">
          <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 py-2 rounded-xl text-sm cursor-pointer">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-sm cursor-pointer">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let userRegistry = [];
    let trips = [];
    let currentUserSession = JSON.parse(localStorage.getItem('gang_current_session'));
    if (!currentUserSession) { window.location.href = "index.html"; }

    // ปั๊มฉากหลังออโต้ 30 ฉาก
    const TOTAL_BGS = 30; 
    const bgSelect = document.getElementById('tripBgSelect');
    if (bgSelect) { bgSelect.innerHTML = ''; for (let i = 1; i <= TOTAL_BGS; i++) { bgSelect.innerHTML += `<option value="${i}">🗺️ ฉากที่ ${i} (Scene #${i})</option>`; } }

    // โหลด Avatar เล็กบน Header
    async function loadHeaderAvatar() {
      try {
        const docSnap = await getDoc(doc(db, "gang_avatars", currentUserSession.name));
        if (docSnap.exists()) {
          const charId = docSnap.data().charId || 0;
          document.getElementById('headerAvatarImg').style.backgroundImage = `url('assets/chars/${charId + 1}.png')`;
        }
      } catch (e) {}
    }
    loadHeaderAvatar();

    onSnapshot(doc(db, "gang_system", "passcodes"), (docSnap) => {
      if (docSnap.exists()) { userRegistry = docSnap.data().users || []; }
      if (!document.getElementById('settingsModal').classList.contains('hidden')) { renderAdminUserTable(); }
    });

    onSnapshot(doc(db, "gang_system", "trips_data"), (docSnap) => {
      if (docSnap.exists()) { trips = docSnap.data().list || []; }
      renderTrips();
    });

    function applyRoleAccess() {
      document.getElementById('navUserDisplayName').innerText = currentUserSession.name;
      document.getElementById('navUserRoleBadge').innerText = currentUserSession.role === 'admin' ? '👑 Admin' : '👥 User';
      if (currentUserSession.role === 'admin') { document.getElementById('adminSettingsSection').classList.remove('hidden'); }
    }
    applyRoleAccess();

    window.logoutGang = function() {
      if (confirm('ต้องการออกจากระบบใช่ไหมครับ?')) { localStorage.removeItem('gang_current_session'); window.location.href = "index.html"; }
    };

    async function saveUserRegistryToFirebase() { await setDoc(doc(db, "gang_system", "passcodes"), { users: userRegistry }); }
    async function saveTripsToFirebase() { await setDoc(doc(db, "gang_system", "trips_data"), { list: trips }); }

    // ⚙️ ระบบจัดการหน้า Settings
    window.openSettingsModal = function() {
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('selfNameInput').value = currentUserSession.name;
      const myData = userRegistry.find(u => u.name.toLowerCase() === currentUserSession.name.toLowerCase());
      document.getElementById('selfPassInput').value = myData ? myData.passcode : '';
      if (currentUserSession.role === 'admin') { renderAdminUserTable(); }
    };
    window.closeSettingsModal = function() { document.getElementById('settingsModal').classList.add('hidden'); };

    // 🧑‍💻 อัปเดตข้อมูลตัวเอง
    window.handleUpdateSelf = async function(e) {
      e.preventDefault();
      const newName = document.getElementById('selfNameInput').value.trim();
      const newPass = document.getElementById('selfPassInput').value.trim();

      // ดักจับพาสเวิร์ดซ้ำ (ยกเว้นรหัสตัวเอง)
      const isDuplicate = userRegistry.some(u => u.passcode === newPass && u.name.toLowerCase() !== currentUserSession.name.toLowerCase());
      if(isDuplicate) { alert("เลขนี้ห้ามใช้ ไปใช้เลขอื่นไป๊!!!"); return; }

      const idx = userRegistry.findIndex(u => u.name.toLowerCase() === currentUserSession.name.toLowerCase());
      if (idx !== -1) { userRegistry[idx].name = newName; userRegistry[idx].passcode = newPass; }

      await saveUserRegistryToFirebase();
      
      if (newName !== currentUserSession.name) {
        currentUserSession.name = newName;
        localStorage.setItem('gang_current_session', JSON.stringify(currentUserSession));
        applyRoleAccess();
        alert("บันทึกข้อมูลเรียบร้อย!\n(หมายเหตุ: การเปลี่ยนชื่ออาจทำให้คุณต้องไปแต่งตัว Avatar ใหม่นะคร้าบ)");
        window.location.reload(); // รีเฟรชหน้าเพื่ออัปเดตข้อมูลทั้งหมด
      } else {
        alert("อัปเดตรหัสผ่านส่วนตัวสำเร็จ!");
      }
      closeSettingsModal();
    };

    // 👑 แอดมินจัดการลูกข่าย
    window.handleAdminUpdateUser = async function(event) {
      event.preventDefault();
      const fName = document.getElementById('adminFriendName').value.trim();
      const fPass = document.getElementById('adminFriendPass').value.trim();

      const isDuplicate = userRegistry.some(u => u.passcode === fPass && u.name.toLowerCase() !== fName.toLowerCase());
      if(isDuplicate) { alert("เลขนี้ห้ามใช้ ไปใช้เลขอื่นไป๊!!!"); return; }

      const idx = userRegistry.findIndex(u => u.name.toLowerCase() === fName.toLowerCase());
      if (idx !== -1) userRegistry[idx].passcode = fPass; else userRegistry.push({ name: fName, passcode: fPass });
      await saveUserRegistryToFirebase();
      document.getElementById('adminFriendName').value = ''; document.getElementById('adminFriendPass').value = '';
      alert(`บันทึกสิทธิ์ของ ${fName} เรียบร้อย!`);
    };

    window.deleteUserPasscode = async function(name) {
      if (confirm(`เตะ ${name} ออกจากระบบ ใช่ไหม?`)) { userRegistry = userRegistry.filter(u => u.name !== name); await saveUserRegistryToFirebase(); }
    };

    function renderAdminUserTable() {
      const table = document.getElementById('adminUserTableContainer'); if(!table) return; table.innerHTML = '';
      userRegistry.forEach(u => {
        table.innerHTML += `<div class="flex justify-between items-center bg-white border border-slate-200 p-2 rounded-xl text-xs shadow-2xs"><div><span class="font-bold text-slate-700 mr-2">👤 ${u.name}</span><span class="font-mono text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-md">PS: ${u.passcode}</span></div><button onclick="deleteUserPasscode('${u.name}')" class="text-red-500 hover:bg-red-50 rounded px-1.5 py-0.5 cursor-pointer transition-colors">🗑ลบ</button></div>`;
      });
    }

    // ฟังก์ชันทริป
    window.openTripDetail = function(tripId) { localStorage.setItem('gang_current_trip_id', tripId); window.location.href = "trip-detail.html"; };
    window.openModal = function(mode, tripId = null) {
      document.getElementById('tripModal').classList.remove('hidden');
      if (mode === 'create') { document.getElementById('editTripId').value = ''; document.getElementById('tripBgSelect').value = '1'; document.getElementById('tripMembersInput').value = 'เดฟ, Mook, Pangpond, เอก'; document.querySelector('#tripModal form').reset(); } 
      else { const targetTrip = trips.find(t => t.id === tripId); if (targetTrip) { document.getElementById('editTripId').value = targetTrip.id; document.getElementById('tripName').value = targetTrip.name; document.getElementById('tripDest').value = targetTrip.dest; document.getElementById('startDate').value = targetTrip.start; document.getElementById('endDate').value = targetTrip.end; document.getElementById('tripBgSelect').value = targetTrip.bgCode || '1'; document.getElementById('tripMembersInput').value = targetTrip.memberList.join(', '); } }
    };
    window.closeModal = function() { document.getElementById('tripModal').classList.add('hidden'); };
    window.handleFormSubmit = async function(event) {
      event.preventDefault(); const editId = document.getElementById('editTripId').value; const parsedMemberList = document.getElementById('tripMembersInput').value.split(',').map(m => m.trim()).filter(m => m.length > 0);
      const tripData = { name: document.getElementById('tripName').value, dest: document.getElementById('tripDest').value, start: document.getElementById('startDate').value, end: document.getElementById('endDate').value, bgCode: document.getElementById('tripBgSelect').value, memberList: parsedMemberList };
      if (editId) { const index = trips.findIndex(t => t.id === editId); if (index !== -1) trips[index] = { ...trips[index], ...tripData }; } else { trips.push({ id: 'trip-' + Date.now(), ...tripData, plans: [], expenses: [] }); }
      await saveTripsToFirebase(); closeModal();
    };

    function renderTrips() {
      const container = document.getElementById('tripListContainer'); if(!container) return; container.innerHTML = '';
      trips.forEach(trip => {
        const adminTripSettings = `<button onclick="openModal('edit', '${trip.id}'); event.stopPropagation();" class="text-xs bg-white/80 hover:bg-white text-slate-700 px-2 py-1 rounded-md font-bold transition-all shadow-2xs">⚙️ แก้ไขทริป</button>`;
        const bgUrl = `assets/bgs/${trip.bgCode || '1'}.png`;
        container.innerHTML += `
          <div class="bg-white border border-gray-200 rounded-2xl shadow-xs overflow-hidden hover:shadow-md transition-all cursor-pointer" onclick="openTripDetail('${trip.id}')">
            <div class="h-28 p-4 flex flex-col justify-between text-white relative bg-slate-800" style="background-image: url('${bgUrl}'); background-size: cover; background-position: center;">
              <div class="absolute inset-0 bg-black/30 z-0"></div><span class="text-[10px] bg-emerald-500 text-white font-bold px-2 py-0.5 rounded-full self-start z-10 shadow-sm">Cloud Sync ☁️</span><h3 class="text-md font-black truncate z-10 drop-shadow-md">${trip.name}</h3>
            </div>
            <div class="p-4"><p class="text-xs text-gray-400">📍 ${trip.dest}</p><p class="text-xs text-gray-500 mb-2">📅 ${trip.start} ถึง ${trip.end}</p><div class="flex justify-between items-center pt-2 border-t border-gray-100 text-xs"><span class="text-gray-500 truncate max-w-[50%] font-medium">👥 แก๊ง: ${trip.memberList.join(', ')}</span><div class="flex gap-1 items-center z-10">${adminTripSettings} <span class="font-bold text-blue-600 hover:underline">ดูแผน →</span></div></div></div>
          </div>`;
      });
    }
  </script>
</body>
</html>
