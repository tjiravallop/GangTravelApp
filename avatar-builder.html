<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - เลือกตัวละคร</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> 
    /* คุมลายเส้นให้คมชัดสไตล์ Pixel Art */
    .pixel-board { image-rendering: pixelated; image-rendering: crisp-edges; } 
  </style>
</head>
<body class="min-h-screen bg-slate-900 font-sans m-0 text-slate-100 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-10 py-4 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <button onclick="window.location.href='dashboard.html'" class="text-xs bg-slate-800 hover:bg-slate-700 font-bold px-3 py-2 rounded-xl text-blue-400 transition-all cursor-pointer">
        ← กลับหน้าแดชบอร์ด
      </button>
      <div class="text-center">
        <h1 class="text-md font-black tracking-wider text-amber-400 uppercase">🕹️ CHARACTER SELECT</h1>
        <p id="builderUserTitle" class="text-xs text-slate-400 font-bold">👤 ผู้เล่น: ...</p>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded-md font-mono">LIVE CLOUD</span>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-8">
    <div class="md:col-span-5 flex flex-col items-center justify-center bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-2xl relative">
      <div class="absolute inset-0 bg-gradient-to-t from-blue-950/30 to-transparent pointer-events-none"></div>
      
      <div class="w-48 h-48 bg-slate-900 border-4 border-slate-700 rounded-xl relative overflow-hidden flex items-center justify-center shadow-inner mb-6">
        <div class="absolute bottom-4 w-24 h-4 bg-black/40 rounded-full blur-xs"></div>
        <div class="w-32 h-32 relative">
          <div id="previewAvatar" class="absolute inset-0 w-full h-full pixel-board" style="background-repeat: no-repeat; background-position: 0% 0;"></div>
        </div>
      </div>

      <div class="w-full space-y-2 z-10">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">💬 คำพูดทักทายเพื่อนๆ</label>
        <input type="text" id="avatarSpeechInput" maxlength="30" placeholder="Let's Go! ลุยยยย..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-center font-bold text-white focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <div class="md:col-span-7 bg-slate-950/50 p-6 rounded-2xl border border-slate-800 shadow-xl flex flex-col">
      <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest pb-2 border-b border-slate-800 mb-4">🛠️ คลังตัวละคร (เลือกอวตารของคุณ)</h2>
      
      <div id="characterGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 flex-1 overflow-y-auto mb-4 content-start"></div>

      <div class="pt-4 border-t border-slate-800 mt-auto">
        <button onclick="saveAvatarDNA()" class="w-full bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-700 text-white font-extrabold py-3 rounded-xl text-xs tracking-wider shadow-lg transition-all active:scale-98 cursor-pointer">
          💾 ยืนยันตัวละครลง Firebase
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUserSession = JSON.parse(localStorage.getItem('gang_current_session'));
    if (!currentUserSession) window.location.href = "index.html";
    document.getElementById('builderUserTitle').innerText = `👤 ผู้เล่น: ${currentUserSession.name}`;

    let selectedCharIndex = 0;
    let globalFrameTick = 0;

    // 🎯 1. กำหนดจำนวนไฟล์ตัวละครที่มีทั้งหมด (ต้องแก้ให้ตรงกับตัวเลขในหน้า trip-detail.html)
    const TOTAL_CHARACTERS = 89; 
    
    // 🎯 2. ให้ Javascript ปั๊มรายชื่อ 1.png, 2.png, 3.png... ให้อัตโนมัติ
    const characterList = [];
    for (let i = 1; i <= TOTAL_CHARACTERS; i++) {
      characterList.push({
        name: `สหายหมายเลข ${i}`,
        sprite: `assets/chars/${i}.png`
      });
    }

    // 🧙‍♂️ 3. ระบบคำนวณเฟรมอัตโนมัติจากขนาดรูปภาพ
    characterList.forEach(char => {
      char.frames = 1; // ตั้งค่ากันเหนียวไว้ก่อน 1 เฟรม
      const img = new Image();
      img.onload = function() {
        char.frames = Math.max(1, Math.round(this.width / this.height));
      };
      img.src = char.sprite;
    });

    // ฟังก์ชันวาดรูปพรีวิวตัวละครหลัก
    function renderPreview() {
      const item = characterList[selectedCharIndex];
      const previewEl = document.getElementById('previewAvatar');
      if (previewEl && item) {
        previewEl.style.backgroundImage = `url('${item.sprite}')`;
        previewEl.style.backgroundSize = `${item.frames * 100}% 100%`;
      }
    }

    // ฟังก์ชันสร้างตารางเลือกตัวละคร
    function generateGrid() {
      const grid = document.getElementById('characterGrid');
      grid.innerHTML = '';
      characterList.forEach((char, idx) => {
        const isActive = selectedCharIndex === idx ? 'ring-4 ring-blue-500 bg-slate-800' : 'border border-slate-700 bg-slate-900 opacity-60 hover:opacity-100';
        grid.innerHTML += `
          <div onclick="selectChar(${idx})" class="rounded-xl p-2 cursor-pointer transition-all flex flex-col items-center gap-2 ${isActive}">
            <div class="w-12 h-12 relative">
              <div id="grid_img_${idx}" class="absolute inset-0 w-full h-full pixel-board" style="background-repeat: no-repeat; background-image: url('${char.sprite}'); background-size: ${char.frames * 100}% 100%;"></div>
            </div>
            <span class="text-[10px] font-bold text-slate-400 text-center truncate w-full">${char.name}</span>
          </div>
        `;
      });
    }

    // 🕒 เครื่องยนต์ขยับแผ่นสไปรท์ชีท (คำนวณสเกล Auto)
    setInterval(() => {
      globalFrameTick++;
      
      // สลับภาพตัวละครหลักตรงกลาง
      const mainChar = characterList[selectedCharIndex];
      if (mainChar) {
        const previewEl = document.getElementById('previewAvatar');
        if (previewEl) {
          previewEl.style.backgroundSize = `${mainChar.frames * 100}% 100%`;
          const xPos = mainChar.frames > 1 ? ((globalFrameTick % mainChar.frames) / (mainChar.frames - 1)) * 100 : 0;
          previewEl.style.backgroundPosition = `${xPos}% 0`;
        }
      }

      // สลับภาพตัวละครในตารางขวามือให้ขยับพร้อมกัน
      characterList.forEach((char, idx) => {
        const gridImg = document.getElementById(`grid_img_${idx}`);
        if (gridImg) {
          gridImg.style.backgroundSize = `${char.frames * 100}% 100%`;
          const xPos = char.frames > 1 ? ((globalFrameTick % char.frames) / (char.frames - 1)) * 100 : 0;
          gridImg.style.backgroundPosition = `${xPos}% 0`;
        }
      });
    }, 150);

    window.selectChar = function(index) {
      selectedCharIndex = index;
      renderPreview();
      generateGrid();
    };

    // โหลดข้อมูลเก่าจากคลาวด์ ถ้าเพื่อนเคยแต่งตัวไว้แล้ว
    async function loadSavedAvatar() {
      try {
        const docSnap = await getDoc(doc(db, "gang_avatars", currentUserSession.name));
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          if (cloudData.charId !== undefined && cloudData.charId < TOTAL_CHARACTERS) selectedCharIndex = cloudData.charId;
          if (cloudData.speech) document.getElementById('avatarSpeechInput').value = cloudData.speech;
        }
      } catch (err) { console.error("Error:", err); }

      // หน่วงเวลาให้รูปภาพโหลดและคำนวณเฟรมเสร็จก่อนโชว์ผล
      setTimeout(() => {
        renderPreview(); 
        generateGrid();
      }, 100);
    }

    window.saveAvatarDNA = async function() {
      const speechText = document.getElementById('avatarSpeechInput').value.trim() || "Let's Go! ✈️";
      try {
        await setDoc(doc(db, "gang_avatars", currentUserSession.name), {
          name: currentUserSession.name,
          charId: selectedCharIndex,
          speech: speechText,
          lastUpdated: Date.now()
        });
        
        alert("🎉 บันทึกตัวละครเรียบร้อย! เด้งกลับไปดูหน้าแพลนทริปกันเลย!");
        
        // เด้งกลับไปหน้าทริปที่เปิดค้างไว้ล่าสุด (หรือแดชบอร์ดถ้าย้อนมา)
        const tripId = localStorage.getItem('gang_current_trip_id');
        if(tripId) { window.location.href = "trip-detail.html"; } 
        else { window.location.href = "dashboard.html"; }
        
      } catch (err) { alert("เกิดข้อผิดพลาดในการเซฟข้อมูลลง Firebase"); }
    };

    // รันครั้งแรกเมื่อเปิดหน้าเว็บ
    loadSavedAvatar();
  </script>
</body>
</html>
