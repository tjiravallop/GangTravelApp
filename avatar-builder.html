<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GangTrip - เลือกตัวละคร</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> .pixel-board { image-rendering: pixelated; image-rendering: crisp-edges; } </style>
</head>
<body class="min-h-screen bg-slate-900 font-sans m-0 text-slate-100 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-10 py-3 px-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <button onclick="window.history.back()" class="text-[11px] bg-slate-800 hover:bg-slate-700 font-bold px-3 py-2 rounded-xl text-blue-400 transition-all cursor-pointer shadow-inner">← กลับ</button>
      <div class="text-center">
        <h1 class="text-sm font-black tracking-widest text-amber-400 uppercase">🕹️ LOBBY</h1>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 bg-slate-800 p-1 pr-3 rounded-full border border-slate-700">
          <div class="w-7 h-7 rounded-full bg-slate-900 overflow-hidden relative border border-slate-600">
            <div id="headerAvatarImg" class="absolute inset-0 w-full h-full pixel-board" style="background-image: url('assets/chars/1.png'); background-size: cover; background-position: left center;"></div>
          </div>
          <p id="navUserDisplayName" class="text-[11px] font-bold text-slate-300 hidden sm:block">Loading...</p>
        </div>
        <button onclick="logoutGang()" class="w-9 h-9 rounded-full bg-red-900/50 hover:bg-red-600 text-red-400 hover:text-white flex items-center justify-center font-bold transition-all cursor-pointer border border-red-800 shadow-sm" title="ออกจากระบบ">🚪</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-8">
    <div class="md:col-span-5 flex flex-col items-center justify-center bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-2xl relative">
      <div class="absolute inset-0 bg-gradient-to-t from-blue-950/30 to-transparent pointer-events-none"></div>
      
      <div class="w-48 h-48 bg-slate-900 border-4 border-slate-700 rounded-xl relative overflow-hidden flex items-center justify-center shadow-inner mb-6">
        <div class="absolute bottom-4 w-24 h-4 bg-black/40 rounded-full blur-xs"></div>
        <div class="w-32 h-32 relative">
          <div id="previewAvatar" class="absolute inset-0 w-full h-full pixel-board" style="background-repeat: no-repeat; background-position: 0% 0;"></div>
        </div>
      </div>

      <div class="w-full space-y-2 z-10">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">💬 คำพูดทักทายเพื่อนๆ</label>
        <input type="text" id="avatarSpeechInput" maxlength="30" placeholder="Let's Go! ลุยยยย..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-center font-bold text-white focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <div class="md:col-span-7 bg-slate-950/50 p-6 rounded-2xl border border-slate-800 shadow-xl flex flex-col">
      <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest pb-2 border-b border-slate-800 mb-4">🛠️ คลังตัวละครสไปรท์ชีท</h2>
      <div id="characterGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 flex-1 overflow-y-auto mb-4 content-start"></div>
      <div class="pt-4 border-t border-slate-800 mt-auto">
        <button onclick="saveAvatarDNA()" class="w-full bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-700 text-white font-extrabold py-3 rounded-xl text-xs tracking-wider shadow-lg transition-all active:scale-98 cursor-pointer">
          💾 ยืนยันตัวละครลง Firebase
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUserSession = JSON.parse(localStorage.getItem('gang_current_session'));
    if (!currentUserSession) window.location.href = "index.html";
    document.getElementById('navUserDisplayName').innerText = currentUserSession.name;

    window.logoutGang = function() {
      if (confirm('ต้องการออกจากระบบใช่ไหมครับ?')) { localStorage.removeItem('gang_current_session'); window.location.href = "index.html"; }
    };

    let selectedCharIndex = 0; let globalFrameTick = 0;

    const TOTAL_CHARACTERS = 90; 
    const characterList = [];
    for (let i = 1; i <= TOTAL_CHARACTERS; i++) { characterList.push({ name: `สหายหมายเลข ${i}`, sprite: `assets/chars/${i}.png` }); }

    characterList.forEach(char => {
      if (!char.grid) { char.frames = 1; const img = new Image(); img.onload = function() { char.frames = Math.max(1, Math.round(this.width / this.height)); }; img.src = char.sprite; }
    });

    function renderPreview() {
      const item = characterList[selectedCharIndex]; const previewEl = document.getElementById('previewAvatar');
      if (previewEl && item) { previewEl.style.backgroundImage = `url('${item.sprite}')`; }
    }

    function generateGrid() {
      const grid = document.getElementById('characterGrid'); grid.innerHTML = '';
      characterList.forEach((char, idx) => {
        const isActive = selectedCharIndex === idx ? 'ring-4 ring-blue-500 bg-slate-800' : 'border border-slate-700 bg-slate-900 opacity-60 hover:opacity-100';
        grid.innerHTML += `
          <div onclick="selectChar(${idx})" class="rounded-xl p-2 cursor-pointer transition-all flex flex-col items-center gap-2 ${isActive}">
            <div class="w-12 h-12 relative"><div id="grid_img_${idx}" class="absolute inset-0 w-full h-full pixel-board" style="background-repeat: no-repeat; background-image: url('${char.sprite}');"></div></div>
            <span class="text-[10px] font-bold text-slate-400 text-center truncate w-full">${char.name}</span>
          </div>
        `;
      });
    }

    setInterval(() => {
      globalFrameTick++;
      const applyTransform = (imgEl, charItem) => {
        if (!imgEl || !charItem) return;
        if (charItem.grid) {
          const { cols, rows, totalFrames } = charItem.grid; const currentFrame = globalFrameTick % totalFrames;
          imgEl.style.backgroundSize = `${cols * 100}% ${rows * 100}%`; const xPos = cols > 1 ? ((currentFrame % cols) / (cols - 1)) * 100 : 0; const yPos = rows > 1 ? (Math.floor(currentFrame / cols) / (rows - 1)) * 100 : 0; imgEl.style.backgroundPosition = `${xPos}% ${yPos}%`;
        } else {
          const frames = charItem.frames || 1; imgEl.style.backgroundSize = `${frames * 100}% 100%`; const xPos = frames > 1 ? ((globalFrameTick % frames) / (frames - 1)) * 100 : 0; imgEl.style.backgroundPosition = `${xPos}% 0`;
        }
      };
      applyTransform(document.getElementById('previewAvatar'), characterList[selectedCharIndex]);
      characterList.forEach((char, idx) => applyTransform(document.getElementById(`grid_img_${idx}`), char));
    }, 150);

    window.selectChar = function(index) { selectedCharIndex = index; renderPreview(); generateGrid(); };

    async function loadSavedAvatar() {
      try {
        const docSnap = await getDoc(doc(db, "gang_avatars", currentUserSession.name)); // โหลดข้อมูล Avatar โดยยึดตาม 'ชื่อเล่น (Display Name)'
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          if (cloudData.charId !== undefined && cloudData.charId < TOTAL_CHARACTERS) selectedCharIndex = cloudData.charId;
          if (cloudData.speech) document.getElementById('avatarSpeechInput').value = cloudData.speech;
          document.getElementById('headerAvatarImg').style.backgroundImage = `url('assets/chars/${selectedCharIndex + 1}.png')`;
        }
      } catch (err) {}
      setTimeout(() => { renderPreview(); generateGrid(); }, 120);
    }

    window.saveAvatarDNA = async function() {
      const speechText = document.getElementById('avatarSpeechInput').value.trim() || "Let's Go! ✈️";
      try {
        await setDoc(doc(db, "gang_avatars", currentUserSession.name), { name: currentUserSession.name, charId: selectedCharIndex, speech: speechText, lastUpdated: Date.now() });
        alert("🎉 บันทึกตัวละครลงคลาวด์เรียบร้อยแล้ว!");
        window.history.back(); // เปลี่ยนเป็นระบบ Back กลับไปหน้าที่แล้วแทน
      } catch (err) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อคลาวด์"); }
    };

    loadSavedAvatar();
  </script>
</body>
</html>
